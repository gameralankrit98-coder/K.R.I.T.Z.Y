<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050"><rect width="100%" height="100%" fill="#f8fafc"/><text x="35" y="45" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">KRITZY — 2-layer PCB placement & routing concept</text><text x="35" y="75" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" fill="#475569">Carrier PCB concept • dimensions/footprints not frozen • tracks are routing corridors, not verified copper geometry</text><rect x="80" y="125" width="1430" height="770" rx="16" fill="#f1f5f9" stroke="#0f172a" stroke-width="4"/><text x="100" y="155" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#0f172a">BOARD EDGE / MECHANICAL OUTLINE TO BE FINALIZED</text><rect x="1170" y="165" width="300" height="125" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="1188" y="195" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#991b1b">ESP32 ANTENNA KEEP-OUT</text><text x="1188" y="221" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#991b1b">No copper/components/battery</text><text x="1188" y="244" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#991b1b">around module antenna region</text><rect x="830" y="185" width="300" height="125" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="850" y="216" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" fill="#0f172a">U1 ESP32-S3-WROOM-1</text><text x="850" y="244" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#0f172a">Place at board edge</text><text x="850" y="268" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#0f172a">Antenna toward keepout →</text><rect x="150" y="210" width="240" height="120" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="168" y="241" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" fill="#0f172a">J1 BATTERY</text><text x="168" y="270" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#0f172a">High-current entry</text><rect x="430" y="210" width="240" height="120" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="448" y="241" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" fill="#0f172a">F1 + SW1</text><text x="448" y="270" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#0f172a">Fuse + power switch</text><rect x="150" y="400" width="310" height="140" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="168" y="432" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" fill="#0f172a">U2 5V BOOST MODULE</text><text x="168" y="461" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#0f172a">High-current path</text><text x="168" y="487" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#0f172a">Keep switch loop compact</text><text x="168" y="513" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#0f172a">Input/Output headers</text><rect x="500" y="400" width="270" height="140" rx="6" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="518" y="432" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" fill="#0f172a">U3 3V3 REG MODULE</text><text x="518" y="461" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#0f172a">Logic rail only</text><text x="518" y="487" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#0f172a">Local bypass capacitors</text><rect x="820" y="400" width="300" height="140" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="838" y="432" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">J8–J14 MODULE HEADERS</text><text x="838" y="461" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#0f172a">OLED / IMU / SD / MIC</text><text x="838" y="487" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#0f172a">AMP / TOUCH / DEBUG</text><rect x="1180" y="400" width="270" height="140" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="1198" y="432" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" fill="#0f172a">J2–J5 SERVOS</text><text x="1198" y="461" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#0f172a">High-current 5V/GND</text><text x="1198" y="487" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#0f172a">Wide pours / connectors</text><rect x="1180" y="600" width="270" height="110" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="1198" y="632" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" fill="#0f172a">J12/J13 AUDIO</text><text x="1198" y="661" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#0f172a">Separate from mic input</text><rect x="820" y="600" width="300" height="110" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="838" y="632" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" fill="#0f172a">I²C / SPI / I²S</text><text x="838" y="661" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#0f172a">Short, labeled signal routes</text><rect x="150" y="600" width="310" height="110" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="168" y="632" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" fill="#0f172a">TEST PADS</text><text x="168" y="661" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#0f172a">VBAT / 5V / 3V3 / GND</text><path d="M390 270 L430 270" fill="none" stroke="#c2410c" stroke-width="5"/><path d="M550 330 L300 400" fill="none" stroke="#c2410c" stroke-width="5"/><path d="M460 470 L1180 470" fill="none" stroke="#c2410c" stroke-width="5" stroke-dasharray="10 8"/><text x="600" y="455" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#c2410c">5V_SERVO path: wide top-layer copper + bottom pours where safe</text><path d="M670 270 L740 270" fill="none" stroke="#a16207" stroke-width="4"/><path d="M740 270 L740 470" fill="none" stroke="#a16207" stroke-width="4"/><path d="M740 470 L770 470" fill="none" stroke="#a16207" stroke-width="4"/><path d="M970 310 L970 400" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M970 540 L970 600" fill="none" stroke="#2563eb" stroke-width="3"/><rect x="110" y="745" width="1370" height="105" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="130" y="775" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#0f172a">BOTTOM LAYER: keep as a near-continuous GND plane; only short unavoidable signals cross it.</text><text x="130" y="805" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#0f172a">Avoid splitting ground under ESP32/RF, microphone, USB and switching regulator return paths.</text><text x="100" y="930" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#b45309">RELEASE GATES: final board dimensions, exact footprints, connector orientation, copper thickness/width, DRC, thermal and current tests.</text><text x="100" y="965" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#b45309">This is placement/routing intent, not a routed Gerber-ready PCB. Do not fabricate from this drawing.</text></svg>