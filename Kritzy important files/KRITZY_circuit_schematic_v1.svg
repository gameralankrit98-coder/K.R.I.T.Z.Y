<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1420" viewBox="0 0 1900 1420"><rect width="100%" height="100%" fill="#f8fafc"/><text x="36" y="48" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="bold" fill="#0f172a" text-anchor="start">KRITZY — Circuit Schematic Design v1.0</text><text x="36" y="80" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="normal" fill="#475569" text-anchor="start">1S LiPo • ESP32-S3-WROOM-1 • 4 × SG90-class servos • plug-in sensor/audio modules • 2-layer carrier PCB</text><text x="36" y="116" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#b45309" text-anchor="start">DESIGN INTENT: logical circuit wiring is specified below; exact power-module MPNs/footprints remain a release gate.</text><rect x="40" y="160" width="300" height="150" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="56" y="190" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="start">J1 — Battery input</text><text x="56" y="217" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">2-pin locking connector</text><text x="56" y="240" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">Pin 1: BAT+ (3.0–4.2 V)</text><text x="56" y="263" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">Pin 2: GND</text><text x="56" y="286" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">Use protected 1S pack; ≥10 A candidate</text><rect x="390" y="160" width="300" height="150" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="406" y="190" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="start">F1 + SW1</text><text x="406" y="217" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">Battery fuse + master switch</text><text x="406" y="240" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">Size from cell, wire & measured peak</text><text x="406" y="263" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">BAT_SW feeds converter inputs</text><text x="406" y="286" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">No charging while operating (v1)</text><rect x="740" y="145" width="370" height="180" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="756" y="175" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="start">U2 — 5 V servo boost module</text><text x="756" y="202" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">Input: BAT_SW / GND</text><text x="756" y="225" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">Output target: 5.0 V, ≥3.4 A</text><text x="756" y="248" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">Use module rated for 1S input at full load</text><text x="756" y="271" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">J2 output: +5V_SERVO / GND</text><rect x="1160" y="145" width="330" height="180" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="1176" y="175" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="start">J2–J5 — Servo headers</text><text x="1176" y="202" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">Each: GND / +5V_SERVO / PWM</text><text x="1176" y="225" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">Neck: GPIO47</text><text x="1176" y="248" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">Left arm: GPIO48</text><text x="1176" y="271" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">Right arm: GPIO38; waist: GPIO39</text><path d="M340 230 L390 230" stroke="#c2410c" stroke-width="4" fill="none"/><path d="M690 230 L740 230" stroke="#c2410c" stroke-width="4" fill="none"/><path d="M1110 230 L1160 230" stroke="#c2410c" stroke-width="4" fill="none"/><text x="360" y="215" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#c2410c" text-anchor="start">BAT+</text><text x="710" y="215" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#c2410c" text-anchor="start">BAT_SW</text><text x="1120" y="215" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#c2410c" text-anchor="start">5V_SERVO</text><rect x="40" y="390" width="300" height="150" rx="10" fill="#fefce8" stroke="#a16207" stroke-width="2"/><text x="56" y="420" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="start">J6 — 1S charge port</text><text x="56" y="447" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">External, protected 1S charger</text><text x="56" y="470" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">Disconnect robot while charging</text><text x="56" y="493" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">Do not connect raw USB 5 V to BAT+</text><text x="56" y="516" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">No onboard charger in v1</text><rect x="390" y="390" width="300" height="150" rx="10" fill="#fefce8" stroke="#a16207" stroke-width="2"/><text x="406" y="420" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="start">U3 — 3.3 V regulator module</text><text x="406" y="447" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">Input: BAT_SW / GND</text><text x="406" y="470" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">Output: regulated 3V3, ≥1 A target</text><text x="406" y="493" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">Input range must include 3.0–4.2 V</text><text x="406" y="516" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">Add local input/output capacitors</text><rect x="740" y="390" width="370" height="150" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="756" y="420" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="start">U1 — ESP32-S3-WROOM-1</text><text x="756" y="447" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">3V3, GND, EN, BOOT/IO0</text><text x="756" y="470" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">USB D−=GPIO19, D+=GPIO20</text><text x="756" y="493" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">UART test pads: TX0/RX0</text><text x="756" y="516" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">Antenna edge keepout: no copper</text><rect x="1160" y="390" width="330" height="150" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="1176" y="420" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="start">J7 — USB-C device</text><text x="1176" y="447" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">USB 2.0 device/programming</text><text x="1176" y="470" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">CC1 → 5.1 kΩ → GND</text><text x="1176" y="493" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">CC2 → 5.1 kΩ → GND</text><text x="1176" y="516" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">D+/D− ESD protection recommended</text><path d="M340 465 L390 465" stroke="#a16207" stroke-width="4" fill="none"/><path d="M690 465 L740 465" stroke="#a16207" stroke-width="4" fill="none"/><path d="M1110 465 L1160 465" stroke="#2563eb" stroke-width="3" fill="none"/><text x="360" y="450" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#a16207" text-anchor="start">BAT_SW</text><text x="710" y="450" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#a16207" text-anchor="start">3V3</text><text x="1120" y="450" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="start">USB D±</text><rect x="40" y="630" width="330" height="180" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="56" y="660" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="start">J8 — OLED module (I²C)</text><text x="56" y="687" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">Pin order: 3V3, GND, SDA, SCL</text><text x="56" y="710" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">SDA=GPIO8; SCL=GPIO9</text><text x="56" y="733" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">3.3 V logic-compatible module only</text><text x="56" y="756" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">One effective pair of pull-ups</text><rect x="410" y="630" width="330" height="180" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="426" y="660" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="start">J9 — MPU6050 module</text><text x="426" y="687" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">Pin order: 3V3, GND, SDA, SCL, INT</text><text x="426" y="710" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">SDA=GPIO8; SCL=GPIO9; INT=GPIO10</text><text x="426" y="733" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">Verify breakout pin order/pull-ups</text><text x="426" y="756" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">3.3 V logic-compatible module only</text><rect x="780" y="630" width="330" height="180" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="796" y="660" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="start">J10 — microSD SPI module</text><text x="796" y="687" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">3V3, GND, CS, SCK, MOSI, MISO</text><text x="796" y="710" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">CS=GPIO21; SCK=GPIO14</text><text x="796" y="733" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">MOSI=GPIO13; MISO=GPIO12</text><text x="796" y="756" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">Must be 3.3 V logic-compatible</text><rect x="1150" y="630" width="330" height="180" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="1166" y="660" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="start">J11 — INMP441 mic module</text><text x="1166" y="687" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">3V3, GND, SCK, WS, SD, L/R</text><text x="1166" y="710" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">BCLK=GPIO5; WS=GPIO4; SD=GPIO6</text><text x="1166" y="733" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">Verify exact module pin labels</text><text x="1166" y="756" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">Keep mic/clock area away from boost</text><rect x="410" y="880" width="330" height="170" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="426" y="910" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="start">J12 — MAX98357A amp module</text><text x="426" y="937" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">3V3 or VIN per module datasheet</text><text x="426" y="960" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">BCLK=GPIO16; LRCLK=GPIO15</text><text x="426" y="983" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">DIN=GPIO7; GND common</text><text x="426" y="1006" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">Use module's specified supply</text><rect x="780" y="880" width="330" height="170" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="796" y="910" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="start">J13 — Speaker</text><text x="796" y="937" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">2-pin output from amp OUTP/OUTN</text><text x="796" y="960" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">BTL: neither speaker terminal to GND</text><text x="796" y="983" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">Speaker impedance per amp module</text><text x="796" y="1006" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">Keep speaker wires away from mic</text><path d="M740 965 L780 965" stroke="#7c3aed" stroke-width="3" fill="none"/><rect x="40" y="880" width="300" height="170" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="56" y="910" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="start">J14 — Touch sensor</text><text x="56" y="937" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">3V3, GND, OUT</text><text x="56" y="960" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">OUT=GPIO11</text><text x="56" y="983" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">Use module with 3.3 V output</text><text x="56" y="1006" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">Optional module header</text><rect x="1160" y="880" width="330" height="170" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="1176" y="910" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="start">Battery monitor + debug</text><text x="1176" y="937" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">BAT_SW → divider/filter → GPIO1 ADC</text><text x="1176" y="960" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">Size divider for 4.2 V max + ADC limit</text><text x="1176" y="983" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">Test pads: VBAT, 5V_SERVO, 3V3, GND</text><text x="1176" y="1006" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">EN, BOOT, UART TX/RX accessible</text><rect x="40" y="1110" width="1450" height="230" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="62" y="1148" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="start">COMMON NET / LAYOUT RULES</text><text x="62" y="1182" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" fill="#0f172a" text-anchor="start">• All grounds connect to the common GND plane; route servo return currents directly to the power-entry/servo power region.</text><text x="62" y="1213" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" fill="#0f172a" text-anchor="start">• 5V_SERVO is a separate high-current rail. Never power servo V+ from ESP32 3V3; GPIOs carry signal only.</text><text x="62" y="1244" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" fill="#0f172a" text-anchor="start">• Use local decoupling at ESP32 and every module header; add 470–1000 µF low-ESR bulk capacitance near servo headers as a starting point.</text><text x="62" y="1275" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" fill="#0f172a" text-anchor="start">• Exact SG90-class stall current varies. Preliminary estimate: 3.38 A at 5 V rail, ≈6.63 A battery input at 3.0 V / 85% efficiency.</text><text x="62" y="1306" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" fill="#0f172a" text-anchor="start">• V1 deliberately uses an external charger and external converter modules; this avoids pretending unselected ICs/footprints are verified.</text><text x="62" y="1368" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#b45309" text-anchor="start">NOT RELEASED FOR FABRICATION: connector footprints, module pinouts, converter performance, ERC/DRC and bench testing still need verification.</text></svg>